# =============================================================================
# DEFAULT AGENT CONFIGURATION TEMPLATE
# =============================================================================
# This is the base configuration for all VSLFC layer agents.
# Layer-specific configs (.vision-ai/{layer}-agent.yaml) extend/override these values.
# 
# Only specify values you want to override in your layer config.
# All unspecified fields will use these defaults.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. IDENTITY
# -----------------------------------------------------------------------------
# Unique identifier for this agent configuration
key: "agent"

# Type of agent (matches VSLFC layer: coding, logic, flow, structure)
agentType: "configurable"

# Configuration version (use semantic versioning)
version: "1.0.0"

# Whether this agent configuration is active
isActive: true

# -----------------------------------------------------------------------------
# 2. PROMPT
# -----------------------------------------------------------------------------
# System prompt template for the agent
# Supports variable substitution: ${variableName}
systemPromptTemplate: |
  You are an AI assistant for the VSLFC (Vision Software Layered Formal Contract) architecture.
  You help analyze, design, and implement software systems following formal contract specifications.
  
  When given a task:
  1. Understand the context and requirements
  2. Call ONE tool to gather information
  3. WAIT for tool results
  4. ANALYZE the results carefully
  5. Provide a clear, helpful ANSWER to the user
  6. STOP - do not call more tools unless absolutely necessary
  
  Available context:
  - Project: ${projectName}
  - Current file: ${currentFile}
  - Task: ${task}

# Variables available for substitution in the template
templateVariables:
  projectName: ""
  currentFile: ""
  task: ""

# -----------------------------------------------------------------------------
# 3. MODEL
# -----------------------------------------------------------------------------
# LLM model configuration
model:
  # Model identifier (provider-specific)
  id: "minimax-m2.1:cloud"
  
  # Model provider (ollama, openai, anthropic, etc.)
  provider: "ollama"
  
  # Context window size (tokens)
  contextLength: 32768
  
  # Maximum output tokens
  maxOutputTokens: 4096
  
  # Temperature for response generation (0.0-1.0)
  temperature: 0.7
  
  # Top-p sampling
  topP: 0.9
  
  # Stop sequences
  stopSequences:
    - "EOS"

# -----------------------------------------------------------------------------
# 4. LLM ENDPOINT
# -----------------------------------------------------------------------------
# LLM server connection settings
llm:
  # Base URL for the LLM API
  baseUrl: "http://localhost:11434"
  
  # API key (if required by provider)
  apiKey: ""
  
  # Request timeout in milliseconds
  timeout: 60000
  
  # Retry settings
  maxRetries: 2
  retryDelayMs: 1000

# -----------------------------------------------------------------------------
# 5. FORMATTING
# -----------------------------------------------------------------------------
# Response formatting rules
formattingRules:
  # Marker that indicates end of structured response
  eosMarker: "EOS"
  
  # Tool call format (JSON schema)
  toolCallFormat: '{"tool":"tool_name","args":{}}'
  
  # Reasoning prefix
  reasoningPrefix: "reasoning:"
  
  # Tool call prefix
  toolCallPrefix: "tool_call:"

# -----------------------------------------------------------------------------
# 6. ITERATION SETTINGS
# -----------------------------------------------------------------------------
# Controls agent iteration behavior
iterationSettings:
  # Maximum number of tool call iterations
  maxIterations: 10
  
  # Maximum tool calls per iteration
  maxToolCallsPerIteration: 1
  
  # Whether to stop after first tool result (for simple queries)
  stopAfterFirstToolResult: false

# -----------------------------------------------------------------------------
# 7. TOOL SELECTION
# -----------------------------------------------------------------------------
# Tool availability and configuration
toolSelection:
  # Tools available to this agent
  availableTools:
    - "read_file"
    - "list_files"
    - "search_files"
    - "write_file"
    - "run_command"
    - "find_definition"
    - "find_references"
    - "find_symbols"
    - "find_implementations"
    - "document_symbols"
  
  # Tools that require special handling
  privilegedTools:
    - "write_file"
    - "run_command"
  
  # Tool call timeout in milliseconds
  toolCallTimeout: 30000

# -----------------------------------------------------------------------------
# 8. SAFETY
# -----------------------------------------------------------------------------
# Safety and security settings
safety:
  # Maximum file size to read (bytes)
  maxFileReadSize: 1048576  # 1MB
  
  # Maximum response size (characters)
  maxResponseSize: 10000
  
  # Whether to allow file writes
  allowFileWrites: true
  
  # Whether to allow command execution
  allowCommandExecution: true
  
  # Blocked commands (shell injection prevention)
  blockedCommands:
    - "rm -rf /"
    - "del /F /S /Q C:\\*"
    - "format"

# -----------------------------------------------------------------------------
# 9. PARSING
# -----------------------------------------------------------------------------
# Response parsing configuration
parsing:
  # Parser template name (from parser-templates)
  parserTemplateName: "default"
  
  # Whether to validate tool call JSON
  validateToolCallJson: true
  
  # Whether to extract reasoning from response
  extractReasoning: true

# -----------------------------------------------------------------------------
# 10. DISCOVERY
# -----------------------------------------------------------------------------
# Discovery-specific settings (for discovery agents)
discovery:
  # Batch size for parallel processing
  batchSize: 10
  
  # Whether to use parallel processing
  useParallelProcessing: true
  
  # Cache settings
  cacheEnabled: true
  cacheTtlHours: 24

# -----------------------------------------------------------------------------
# 11. EXECUTION
# -----------------------------------------------------------------------------
# Execution environment settings
execution:
  # Working directory (relative to workspace root)
  workingDirectory: ""
  
  # Environment variables
  environment: {}
  
  # Shell to use for command execution
  shell: "bash"
