# =============================================================================
# DEFAULT AGENT CONFIGURATION TEMPLATE
# =============================================================================
# This is the base configuration for all VSLFC layer agents.
# Layer-specific configs (.vision-ai/{layer}-agent.yaml) extend/override these values.
#
# Only specify values you want to override in your layer config.
# All unspecified fields will use these defaults.
# =============================================================================

# --- 1. IDENTITY ---
key: agent
agentType: configurable
version: "1.0.0"
isActive: true

# --- 2. PROMPT ---
systemPromptTemplate: |
  You are an AI assistant for the VSLFC (Vision Software Layered Formal Contract) architecture.
  You help analyze, design, and implement software systems following formal contract specifications.

  ## UNIVERSAL RULES (STRICT - NEVER IGNORE)

  ### NEVER
  - **Edit files** with Python/PowerShell — Use **`write_file`** or **`apply_edits`**
  - **Kill processes** with `taskkill` — User handles this
  - **Use relative paths** — Always use **absolute paths**
  - **Commit** without being asked
  - **Run tests** unless explicitly asked
  - **Explore beyond 10 calls** without making an edit

  ## ✅ WORKFLOW

  ### Reading Files
  - Use **`read_file`** (with absolute path) to read file contents
  - For file structure overview: use **`get_file_context`**
  - For finding code: use **`search_files`** with pattern matching
  - For directory listings: use **`list_directory`** with `recursive:true`

  ### Editing Files
  1. Read with `read_file` to see current content
  2. Modify with `write_file` or `apply_edits`
  3. Build (`run_build`), fix errors if any, rebuild

  ### Build Verification
  - Use `run_build` with the compile command (e.g., `.\gradlew compileKotlin`)
  - If the same build command fails 3 times with the same error, STOP and report
  - Fix source files (src/main), NOT test files (src/test), unless user asks

  ### Pre-Existing Errors
  - If build fails on files you didn't edit, report "BUILD FAILED with pre-existing errors only"

  ### Restart Servers
  1. Ask user to close the terminal
  2. Wait for confirmation
  3. Start server, output "BUILD PASSED. Server running."

  When given a task:
  1. Use i2vision_get_context to understand the current code architecture
  2. Read relevant files before making changes
  3. Make focused, minimal edits
  4. Verify your changes make sense in the broader architecture

  Available context:
  - Project: ${projectName}
  - Current file: ${currentFile}
  - Task: ${task}

  --- ERROR HANDLING (CRITICAL) ---
  When a tool returns an error:
  1. DO NOT retry the same tool call with the same arguments
  2. Analyze the error message to understand what went wrong
  3. Take a different approach:
     - If path not found (ENOENT): Tell the user the path doesn't exist, offer to list parent directory or search for similar paths
     - If permission denied: Tell the user and ask for alternative location
     - If file is empty: Report that the file exists but is empty
  4. If you've tried 2 different approaches and both failed, report to user and ask for clarification

  Example responses to errors:
  - "The folder 'ui' doesn't exist in this project. I found these folders instead: app, core, feature. Would you like me to check one of those?"
  - "I couldn't find the file at that path. Would you like me to search for files with similar names?"

templateVariables:
  projectName: "i2vision"
  currentFile: ""
  task: ""

# --- 3. MODEL ---
model:
  id: deepseek-v4-pro
  provider: 3d-llm
  contextLength: 64000
  maxOutputTokens: 4096
  temperature: 0.2
  topP: 0.95
  thinkingEnabled: false
  searchEnabled: true

# --- 4. LLM BEHAVIOR ---
llm:
  timeoutSeconds: 120
  modificationTimeoutSeconds: 180
  finalTurnBonusSeconds: 60
  maxRetries: 3
  retryBackoffMs: [1000, 2000, 4000]

# --- 5. FORMATTING RULES ---
formattingRules:
  rules: 'OUTPUT FORMAT: Use reasoning for explanation, then output ONE JSON tool call per response.'
  brief: '{"name":"tool_name","arguments":{"param":"value"}}'
  reasoningHeader: "reasoning:"
  toolCallHeader: "tool_call:"
  eosMarker: "EOS"

# --- 6. ITERATION ---
iterationSettings:
  maxIterations: 10
  maxConsecutiveToolCalls: 12
  enableKickstart: true
  kickstartMinInvalidOutputs: 2

# --- 7. TOOL SELECTION ---
toolSelection:
  requiredToolsForModification: [read_file, write_file, apply_edits]
  defaultRelevanceThreshold: 0.6
  maxToolsPerTask: 10
  toolTimeoutSeconds: 30

# --- 8. SAFETY ---
safety:
  modificationKeywords: [edit, modify, update, change, fix, make, create, set, replace, remove, delete, add, persist, save]
  listingKeywords: [list, show]
  listingModificationExclusions: [edit, modify, update]
  blockGeneratedPaths: [/build/, /bin/, /out/, /generated/]
  allowNewFileCreationPatterns: [create file, new file, add file, scaffold, generate file]

# --- 9. PARSING ---
parsing:
  enabledParsers: [header, naked_json]
  headerPattern: "^(reasoning|tool_call|EOS|Observation)\\s*:?\\s*"
  toolCallPattern: "\\{\\s*\"tool\"\\s*:\\s*\"[A-Za-z0-9_]+\""
  malformedPattern: "([a-zA-Z0-9_]+)\"\\s*,\\s*\"args\"\\s*:\\s*\\{"
  maxResponseSize: 200000
  maxProseChars: 400

# --- 10. REPAIR ---
repairStrategies: []

# --- 11. DISCOVERY ---
discovery:
  maxSearchTerms: 8
  maxCandidates: 12
  frameworkProfiles: {}

# --- 12. EXECUTION ---
execution:
  enableBuildVerification: false
  buildCommand: gradlew.bat compileKotlin
  buildTimeoutSeconds: 90
  enableSynthesis: true
  synthesisOnlyForNonModification: true
  fileOperations:
    mode: direct
    shell:
      executable: powershell
      useNoProfile: true
      readFileEnabled: true
      writeFileEnabled: true
      listDirectoryEnabled: true
      regexSearchEnabled: true

# --- 13. FORMATTING ---
formatting:
  chunkSize: 200
  delayMs: 10
  maxObservationChars: 20000

# --- 14. STREAMING ---
streaming:
  enabled: true
  methodCandidates: [stream, runStreaming, generateStream]
  fallbackToNonStreaming: true
  fallbackChunkSize: 200
  fallbackChunkDelayMs: 10

# --- 15. MCP ---
mcp:
  enabled: true
  injectClusterContext: true
  directCliEnabled: false
  allowedToolPrefixes: [i2vision_, read_, write_, edit_, list_, grep_]
  strictToolNamePolicy: false

# --- 16. SYSTEM PROMPT RULES ---
# Custom rules appended to the system prompt after --- RULES ---.
# If omitted, built-in defaults are used. Each item becomes a bullet.
systemPromptRules:
  rules:
    - "ALWAYS use tool calls. Never describe plans."
    - 'FOR "run backend" or "run server": use run_terminal with gradlew :app:server:run (NOT run_build)'
    - 'FOR compilation: use run_build with compileKotlin (source code ONLY, NO tests). NEVER use "build" - it runs ALL tests.'
    - "apply_edits: MAX 50 edits per call. For large changes, use write_file instead."
    - "When build fails: READ failing files, FIX code, THEN re-run compileKotlin."
    - "NEVER re-run build without fixing first."
    - "SERVER STARTUP WORKFLOW:"
    - "  1. Start server with run_terminal"
    - "  2. WAIT 20-30 seconds (Gradle servers take time!)"
    - "  3. Check terminal_status"
    - '  4. If terminal shows "not running" or BUILD FAILED: run .\\gradlew :app:server:compileKotlin to see errors'
    - "  5. Fix errors with apply_edits, then retry"
    - "SEARCH TIP: If search_files finds files, READ them immediately. Do NOT search again with different patterns."
    - "FOCUS: Fix source files (src/main), NOT test files (src/test), unless user specifically asks about tests."
    - "Paths: relative to workspace root, use forward slashes (/)."
