# =============================================================================
# DEFAULT AGENT CONFIGURATION TEMPLATE
# =============================================================================
# This is the base configuration for all VSLFC layer agents.
# Layer-specific configs (.vision-ai/{layer}-agent.yaml) extend/override these values.
# 
# Only specify values you want to override in your layer config.
# All unspecified fields will use these defaults.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. IDENTITY
# -----------------------------------------------------------------------------
# Unique identifier for this agent configuration
key: "agent"

# Type of agent (matches VSLFC layer: coding, logic, flow, structure)
agentType: "configurable"

# Configuration version (use semantic versioning)
version: "1.0.0"

# Whether this agent configuration is active
isActive: true

# -----------------------------------------------------------------------------
# 2. PROMPT
# -----------------------------------------------------------------------------
# System prompt template for the agent
# Supports variable substitution: ${variableName}
systemPromptTemplate: |
  You are an AI assistant for the VSLFC (Vision Software Layered Formal Contract) architecture.
  You help analyze, design, and implement software systems following formal contract specifications.
  
  When given a task:
  1. Understand the context and requirements
  2. Follow the VSLFC layer specifications
  3. Generate clear, maintainable artifacts
  4. Verify consistency with other layers
  
  Available context:
  - Project: ${projectName}
  - Current file: ${currentFile}
  - Task: ${task}

# Variables available for template substitution
templateVariables:
  projectName: ""
  currentFile: ""
  task: ""

# References to rule sets (defined elsewhere in the system)
# ruleSetKeys: ["rule-1", "rule-2"]

# Name of the output parser template to use
# parserTemplateName: "json-output"

# -----------------------------------------------------------------------------
# 3. MODEL
# -----------------------------------------------------------------------------
# Model configuration for LLM inference
model:
  # Model identifier (format depends on provider)
  # Examples: "qwen3:4b", "llama3:8b", "minimax-m2.1:cloud"
  id: "minimax-m2.1:cloud"
  
  # Provider name (ollama, openai, anthropic, etc.)
  provider: "ollama"
  
  # Maximum context window size (tokens)
  contextLength: 32768
  
  # Maximum tokens in response
  maxOutputTokens: 4096
  
  # Sampling temperature (0.0 = deterministic, 1.0 = creative)
  temperature: 0.7
  
  # Top-p sampling (nucleus sampling threshold)
  topP: 0.9

# -----------------------------------------------------------------------------
# 4. LLM BEHAVIOR
# -----------------------------------------------------------------------------
# Timeout and retry settings for LLM calls
llm:
  # General timeout for LLM requests (seconds)
  timeoutSeconds: 120
  
  # Timeout for modification operations (seconds)
  modificationTimeoutSeconds: 300
  
  # Extra time bonus for final turn (seconds)
  finalTurnBonusSeconds: 60
  
  # Maximum number of retry attempts
  maxRetries: 3
  
  # Backoff delays between retries (milliseconds)
  retryBackoffMs: [1000, 2000, 4000]

# -----------------------------------------------------------------------------
# 5. FORMATTING RULES
# -----------------------------------------------------------------------------
# Rules for parsing agent output
formattingRules:
  # Full formatting rules description
  rules: ""
  
  # Brief format specification
  brief: ""
  
  # Header marker for reasoning sections
  reasoningHeader: "## Reasoning"
  
  # Header marker for tool call sections
  toolCallHeader: "## Tool Calls"
  
  # End-of-stream marker
  eosMarker: "### END"

# -----------------------------------------------------------------------------
# 6. ITERATION
# -----------------------------------------------------------------------------
# Settings for iterative task execution
iterationSettings:
  # Maximum number of iteration cycles
  maxIterations: 10
  
  # Maximum consecutive tool calls without user input
  maxConsecutiveToolCalls: 5
  
  # Enable kickstart mechanism for stuck iterations
  enableKickstart: false
  
  # Number of invalid outputs before kickstart triggers
  kickstartMinInvalidOutputs: 3

# -----------------------------------------------------------------------------
# 7. TOOL SELECTION
# -----------------------------------------------------------------------------
# Configuration for tool discovery and selection
toolSelection:
  # Tools required for modification operations
  requiredToolsForModification: []
  
  # Default relevance threshold for tool selection (0.0-1.0)
  defaultRelevanceThreshold: 0.5
  
  # Maximum number of tools to consider per task
  maxToolsPerTask: 10
  
  # Timeout for individual tool calls (seconds)
  toolTimeoutSeconds: 60

# -----------------------------------------------------------------------------
# 8. SAFETY
# -----------------------------------------------------------------------------
# Safety constraints and path restrictions
safety:
  # Keywords that indicate modification intent
  modificationKeywords: []
  
  # Keywords that indicate listing/read-only intent
  listingKeywords: []
  
  # Keywords to exclude from listing-modification detection
  listingModificationExclusions: []
  
  # Path patterns to block (generated files, build artifacts, etc.)
  blockGeneratedPaths: []
  
  # Patterns that indicate safe new file creation
  allowNewFileCreationPatterns: []

# -----------------------------------------------------------------------------
# 9. PARSING
# -----------------------------------------------------------------------------
# Output parsing configuration
parsing:
  # List of enabled parsers
  enabledParsers: ["tool-call"]
  
  # Regex pattern for header detection
  headerPattern: ""
  
  # Regex pattern for tool call detection
  toolCallPattern: ""
  
  # Regex pattern for malformed output detection
  malformedPattern: ""
  
  # Maximum response size (characters)
  maxResponseSize: 32768
  
  # Maximum prose characters before truncation
  maxProseChars: 16384

# -----------------------------------------------------------------------------
# 10. REPAIR
# -----------------------------------------------------------------------------
# Strategies for handling parsing failures
# repairStrategies: []

# -----------------------------------------------------------------------------
# 11. DISCOVERY
# -----------------------------------------------------------------------------
# Configuration for tool and context discovery
discovery:
  # Maximum search terms to generate
  maxSearchTerms: 5
  
  # Maximum candidate results to consider
  maxCandidates: 10
  
  # Framework-specific profiles
  frameworkProfiles: {}

# -----------------------------------------------------------------------------
# 12. EXECUTION
# -----------------------------------------------------------------------------
# Build and execution settings
execution:
  # Enable build verification after modifications
  enableBuildVerification: true
  
  # Command to run for build verification
  buildCommand: "./gradlew build"
  
  # Timeout for build command (seconds)
  buildTimeoutSeconds: 120
  
  # Enable code synthesis features
  enableSynthesis: true
  
  # Only use synthesis for non-modification tasks
  synthesisOnlyForNonModification: false
  
  # File operation mode (direct, shell, sandbox)
  fileOperations:
    mode: "shell"
    
    # Shell execution settings
    shell:
      # Shell executable
      executable: "bash"
      
      # Don't load shell profile
      useNoProfile: true
      
      # Enable read file operations
      readFileEnabled: true
      
      # Enable write file operations
      writeFileEnabled: true
      
      # Enable directory listing
      listDirectoryEnabled: true
      
      # Enable regex search
      regexSearchEnabled: true

# -----------------------------------------------------------------------------
# 13. FORMATTING
# -----------------------------------------------------------------------------
# Output formatting settings
formatting:
  # Chunk size for streaming output
  chunkSize: 100
  
  # Delay between chunks (milliseconds)
  delayMs: 50
  
  # Maximum observation characters
  maxObservationChars: 8192

# -----------------------------------------------------------------------------
# 14. STREAMING
# -----------------------------------------------------------------------------
# Streaming response configuration
streaming:
  # Enable streaming responses
  enabled: true
  
  # Candidate method names for streaming
  methodCandidates: []
  
  # Fallback to non-streaming if streaming fails
  fallbackToNonStreaming: true
  
  # Chunk size for non-streaming fallback
  fallbackChunkSize: 200
  
  # Delay between fallback chunks (milliseconds)
  fallbackChunkDelayMs: 50

# -----------------------------------------------------------------------------
# 15. MCP (MODEL CONTEXT PROTOCOL)
# -----------------------------------------------------------------------------
# MCP integration settings
mcp:
  # Enable MCP integration
  enabled: true
  
  # Inject cluster context into MCP calls
  injectClusterContext: true
  
  # Enable direct CLI access via MCP
  directCliEnabled: false
  
  # Allowed tool name prefixes
  allowedToolPrefixes: []
  
  # Enforce strict tool naming policy
  strictToolNamePolicy: true

# =============================================================================
# END OF DEFAULT CONFIGURATION
# =============================================================================
