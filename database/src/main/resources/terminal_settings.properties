# Terminal Display Settings

[Core Display Toggles]
show_welcome_banner|Show ASCII art/welcome message on session start|true
show_status_bar|Display status bar with session info at bottom/top|true
show_timestamps|Show timestamps for each message|false
show_token_count|Display token usage per message|false
show_running_cost|Show running cost in USD|false
show_progress_bar|Visual context window usage bar|true

[Conversation Display]
show_user_prompts|Display user input|true
show_ai_responses|Display AI responses|true
show_thinking_process|Show AI's internal reasoning (if available)|false
show_command_suggestions|Display suggested commands before execution|true
show_confidence_scores|Show AI confidence levels in responses|false

[Tool Execution Display]
show_command_execution|Display commands being run|true
show_command_output|Show output from executed commands|true
show_command_exit_codes|Display exit codes (0, 1, etc)|false
show_command_duration|Show how long commands took to run|false
show_pending_approvals|Display commands waiting for approval|true
show_auto_approved|Indicate when commands run without prompting|false

[Code & File Operations]
show_file_reads|Display when files are being read|false
show_file_writes|Display when files are being created/updated|true
show_file_deletes|Display when files are being deleted|true
show_code_diffs|Show visual diff of code changes|true
show_diff_highlights|Color-coded additions/removals in diffs|true
show_file_tree|Display file tree structure when navigating|false
show_search_results|Display file search/match results|true

[Status Indicators]
show_status_symbols|Show ? ? ? ? status icons|true
show_status_colors|Use green/yellow/gray/red for status|true
show_typing_indicator|Show when AI is processing/thinking|true
show_connection_status|Display API connection health|false
show_error_details|Show detailed error messages|false
show_warnings|Display warning messages|true

[MCP & Integrations]
show_mcp_connections|Display connected MCP servers (? icons)|false
show_mcp_pool_status|Show shared MCP socket pool info|false
show_external_tools|Display when using debuggers/lldb/etc|false
show_api_calls|Show external API calls being made|false

[Multi-Session Features]
show_session_grid|Display dashboard of multiple sessions|false
show_session_positions|Show grid layout (row/column/size)|false
show_fork_indicator|Mark sessions that were forked|true
show_parent_session|Display link to parent session|true
show_parallel_sessions|Show other concurrent sessions|false

[Performance Metrics]
show_response_times|Display AI response latency|false
show_command_times|Display command execution duration|false
show_memory_usage|Show current memory consumption|false
show_cpu_usage|Show CPU usage percentage|false
show_network_latency|Display API round-trip time|false
show_rate_limits|Show remaining API rate limits|false

[Debug & Technical]
show_raw_json|Display raw JSON responses from AI|false
show_stack_traces|Show full error stack traces|false
show_api_headers|Display API request/response headers|false
show_token_breakdown|Show prompt vs completion tokens|false
show_model_info|Display which AI model is active|false
show_system_prompts|Show system prompts sent to AI|false

[Notification Settings]
notify_on_complete|Alert when long operation finishes|true
notify_on_error|Alert when errors occur|true
notify_on_approval|Alert when user approval needed|true
notify_on_watch_match|Alert when watch mode detects pattern|false
sound_on_complete|Play sound when done|false
sound_on_error|Play sound on error|false

[Formatting & Appearance]
compact_mode|Minimal spacing between messages|false
verbose_mode|Detailed output with all details|true
word_wrap|Wrap long lines|true
syntax_highlighting|Color-code code blocks|true
markdown_rendering|Render markdown formatting|true
emoji_enabled|Show emoji indicators (???)|true
ascii_borders|Show box drawing characters|false

[Card Styling]
render_rich_tool_cards|Use rich card layout for tool calls|true
highlight_tool_params|Highlight parameter keys in tool calls|true
show_tool_icons|Show icons in tool cards|true
card_bg_color_enabled|Use custom background color for cards|true
card_border_enabled|Use borders for cards|true
