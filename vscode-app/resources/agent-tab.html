<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline' https://*; font-src 'self' https://* data: blob: vscode-resource:; script-src 'unsafe-inline'; img-src 'self' https: data:;">
  <title>i2-Vision Agent</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codicons/0.0.36/codicon.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--vscode-font-family);font-size:var(--vscode-font-size);color:var(--vscode-foreground);background-color:var(--vscode-editor-background);padding:0;line-height:1.6;height:100vh;display:flex;flex-direction:column;overflow:hidden}
    .header{flex:0 0 auto;padding:8px 16px;background-color:var(--vscode-editorWidget-background);border-bottom:1px solid var(--vscode-editorWidget-border);display:flex;flex-wrap:nowrap;gap:16px;align-items:center;justify-content:space-between}
    .header-left{display:flex;gap:12px;align-items:center;flex-wrap:nowrap}
    .header-item{display:flex;align-items:center;gap:6px;font-size:0.85em;color:var(--vscode-foreground);white-space:nowrap}
    .header-item .codicon{font-size:1.1em;color:var(--vscode-descriptionForeground)}
    .provider-model-group{display:flex;gap:10px;align-items:center;flex-wrap:nowrap}
    .selector-group{display:flex;align-items:center;gap:6px}
    .selector-group label{font-weight:500;color:var(--vscode-descriptionForeground);font-size:0.8em}
    .selector-group select{padding:3px 8px;border:1px solid var(--vscode-input-border);border-radius:4px;background:var(--vscode-input-background);color:var(--vscode-input-foreground);font-family:var(--vscode-font-family);font-size:0.8em;cursor:pointer;min-width:120px}
    .selector-group select:hover{border-color:var(--vscode-focusBorder)}
    .selector-group select:focus{outline:2px solid var(--vscode-focusBorder);outline-offset:-2px}
    .token-meter{display:flex;align-items:center;gap:8px;font-size:0.75em;color:var(--vscode-descriptionForeground)}
    .token-bar{width:100px;height:4px;background-color:var(--vscode-input-border);border-radius:2px;overflow:hidden}
    .token-fill{height:100%;background:linear-gradient(90deg,var(--vscode-terminal-successBackground) 0%,var(--vscode-terminal-successBackground) 50%,var(--vscode-terminal-ansiYellow) 75%,var(--vscode-errorForeground) 100%);transition:width 0.3s ease}
    .header-right{display:flex;gap:8px;align-items:center}
    .btn-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;border-radius:4px;cursor:pointer;color:var(--vscode-foreground);transition:all 0.2s ease;font-size:1.2em;font-weight:bold}
    .btn-icon:hover{background:var(--vscode-toolbar-hoverBackground);border-color:var(--vscode-input-border)}
    .center-panel{flex:1 1 auto;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
    .timeline{max-width:900px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
    .message{padding:12px 15px;border-radius:6px;white-space:pre-wrap;border-left:4px solid}
    .message.user{background-color:var(--vscode-editor-inactiveSelectionBackground);border-left-color:var(--vscode-button-background)}
    .message.agent{background-color:var(--vscode-editor-selectionBackground);border-left-color:var(--vscode-editorLineNumber-foreground)}
    .message.restored{background-color:var(--vscode-editorWidget-background);border-left-color:var(--vscode-descriptionForeground);opacity:0.8}
    .message.stopped{background-color:var(--vscode-editorWidget-background);border-left-color:var(--vscode-descriptionForeground);font-style:italic;color:var(--vscode-descriptionForeground)}
    .message.error{background-color:var(--vscode-inputValidation-errorBackground);border-left-color:var(--vscode-errorForeground);color:var(--vscode-errorForeground)}
    .thinking-indicator{display:flex;align-items:center;gap:10px;padding:10px 12px;background-color:var(--vscode-editor-selectionBackground);border-left:3px solid var(--vscode-progressBarBackground);border-radius:6px;font-style:italic;color:var(--vscode-descriptionForeground)}
    .thinking-indicator .codicon-loading{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .reasoning-card{background-color:var(--vscode-editorWidget-background);border:1px solid var(--vscode-editorWidget-border);border-radius:6px;padding:10px 12px;margin-bottom:8px;border-left:3px solid var(--vscode-descriptionForeground);transition:all 0.2s ease}
    .reasoning-card-header{display:flex;align-items:center;gap:8px;font-weight:600;font-size:0.85em;color:var(--vscode-descriptionForeground);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
    .reasoning-card-content{font-size:0.9em;line-height:1.5;color:var(--vscode-foreground);white-space:pre-wrap}
    .tool-card{background-color:var(--vscode-editorWidget-background);border:1px solid var(--vscode-editorWidget-border);border-radius:6px;padding:4px 6px;margin:4px 0;display:flex;flex-direction:column;gap:2px;transition:all 0.2s ease}
    .tool-card-row{display:flex;align-items:center;gap:8px;font-size:0.85em}
    .tool-card-icon{display:flex;align-items:center;justify-content:center;width:20px;height:20px;background:var(--vscode-badge-background);border-radius:3px;color:var(--vscode-badge-foreground);font-size:0.7em}
    .tool-card-command{font-weight:600;color:var(--vscode-foreground);text-transform:capitalize;white-space:nowrap}
    .tool-card-args{color:var(--vscode-descriptionForeground);font-size:0.8em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tool-card-options{display:flex;gap:4px;opacity:0;transition:opacity 0.2s}
    .tool-card:hover .tool-card-options{opacity:1}
    .tool-card-option{cursor:pointer;color:var(--vscode-descriptionForeground);font-size:0.75em;padding:2px 4px;border-radius:3px}
    .tool-card-option:hover{background:var(--vscode-toolbar-hoverBackground);color:var(--vscode-foreground)}
    .tool-card-content{display:none;flex-direction:column;gap:4px;margin-top:4px;padding:6px;background:var(--vscode-textCodeBlock-background);border-radius:4px;font-family:var(--vscode-editor-font-family);font-size:0.75em;max-height:150px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
    .tool-card.expanded .tool-card-content{display:flex}
    .tool-card.running{border-left:3px solid var(--vscode-progressBarBackground)}
    .tool-card.done{border-left:3px solid var(--vscode-terminal-successBackground)}
    .tool-card.error{border-left:3px solid var(--vscode-errorForeground)}
    .response-card{background:transparent;padding:8px 0;border-radius:0}
    .response-card.streaming{border-left:none}
    .response-card.done{border-left:none}
    .response-card-header{display:none}
    .response-card-body{background:transparent;padding:0;font-family:var(--vscode-font-family);font-size:0.9em;white-space:pre-wrap;word-break:break-word;line-height:1.5;max-height:none;overflow-y:visible}
    .response-card{background-color:var(--vscode-editorWidget-background);border:1px solid var(--vscode-editorWidget-border);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
    .response-card.streaming{border-left:3px solid var(--vscode-progressBarBackground)}
    .response-card.done{border-left:3px solid #73c991}
    .response-card-header{display:flex;align-items:center;gap:8px;font-size:0.9em;font-weight:600;color:var(--vscode-foreground)}
    .response-card-status{font-size:0.8em;margin-left:auto}
    .response-card-status.streaming{color:var(--vscode-progressBarBackground)}
    .response-card-status.done{color:#73c991}
        .response-card-body{background-color:var(--vscode-textCodeBlock-background);padding:10px 12px;border-radius:4px;font-family:var(--vscode-editor-font-family);font-size:0.9em;white-space:pre-wrap;word-break:break-word;line-height:1.5;max-height:500px;overflow-y:auto}

    /* Markdown rendering styles */
    .md-content h1{font-size:1.4em;font-weight:600;margin:0.6em 0 0.3em;color:var(--vscode-foreground);border-bottom:1px solid var(--vscode-editorWidget-border);padding-bottom:0.2em}
    .md-content h2{font-size:1.2em;font-weight:600;margin:0.5em 0 0.25em;color:var(--vscode-foreground);border-bottom:1px solid var(--vscode-editorWidget-border);padding-bottom:0.15em}
    .md-content h3{font-size:1.1em;font-weight:600;margin:0.4em 0 0.2em;color:var(--vscode-foreground)}
    .md-content h4,.md-content h5,.md-content h6{font-size:1em;font-weight:600;margin:0.3em 0 0.15em;color:var(--vscode-foreground)}
    .md-content p{margin:0.3em 0;line-height:1.6}
    .md-content ul,.md-content ol{margin:0.3em 0;padding-left:1.5em}
    .md-content li{margin:0.15em 0}
    .md-content blockquote{margin:0.4em 0;padding:4px 12px;border-left:3px solid var(--vscode-descriptionForeground);background:var(--vscode-editor-inactiveSelectionBackground);color:var(--vscode-foreground);font-style:italic}
    .md-content table{border-collapse:collapse;margin:0.4em 0;width:100%;font-size:0.9em}
    .md-content th,.md-content td{padding:4px 8px;border:1px solid var(--vscode-editorWidget-border);text-align:left}
    .md-content th{background:var(--vscode-editorWidget-background);font-weight:600}
    .md-content tr:nth-child(even){background:var(--vscode-editor-inactiveSelectionBackground)}
    .md-content pre{margin:0.4em 0;padding:8px 10px;background:var(--vscode-editor-background);border:1px solid var(--vscode-editorWidget-border);border-radius:4px;overflow-x:auto;font-size:0.85em;line-height:1.4}
    .md-content code{font-family:var(--vscode-editor-font-family);font-size:0.9em;background:var(--vscode-textCodeBlock-background);padding:1px 4px;border-radius:3px;color:var(--vscode-foreground)}
    .md-content pre code{background:transparent;padding:0;border-radius:0;font-size:inherit}
    .md-content strong{font-weight:600}
    .md-content em{font-style:italic}
    .md-content a{color:var(--vscode-textLink-foreground);text-decoration:none}
    .md-content a:hover{text-decoration:underline}
    .md-content hr{border:none;border-top:1px solid var(--vscode-editorWidget-border);margin:0.6em 0}
    .md-content img{max-width:100%;border-radius:4px}
    .message-footer{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background-color:var(--vscode-editorWidget-background);border-radius:4px;margin-top:10px;font-size:0.85em}
    .footer-left{display:flex;gap:15px;color:var(--vscode-descriptionForeground)}
    .footer-right{display:flex;gap:8px}
    .footer-panel{flex:0 0 auto;padding:16px;background-color:var(--vscode-editorWidget-background);border-top:1px solid var(--vscode-editorWidget-border)}
    .input-container{max-width:900px;margin:0 auto}
    .provider-model-row{display:flex;gap:16px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
    .token-meter{display:flex;align-items:center;gap:8px;font-size:0.75em;color:var(--vscode-descriptionForeground);margin-left:auto;}
    .token-bar{width:100px;height:4px;background-color:var(--vscode-input-border);border-radius:2px;overflow:hidden}
    .token-fill{height:100%;background:linear-gradient(90deg,var(--vscode-terminal-successBackground) 0%,var(--vscode-terminal-successBackground) 50%,var(--vscode-terminal-ansiYellow) 75%,var(--vscode-errorForeground) 100%);transition:width 0.3s ease}
    .input-box{width:100%;padding:12px;border:1px solid var(--vscode-editorWidget-border);border-radius:6px;background-color:var(--vscode-input-background);color:var(--vscode-input-foreground);font-family:var(--vscode-font-family);font-size:var(--vscode-font-size);resize:vertical;min-height:80px}
    .input-box:focus{outline:2px solid var(--vscode-focusBorder);outline-offset:-2px}
    .button-row{margin-top:10px;display:flex;gap:8px;align-items:center}
    .btn-action{padding:8px 20px;border:none;border-radius:4px;cursor:pointer;font-family:var(--vscode-font-family);font-size:0.9em;display:inline-flex;align-items:center;gap:8px;font-weight:500;transition:all 0.2s ease}
    .btn-action.send{background-color:var(--vscode-button-background);color:var(--vscode-button-foreground)}
    .btn-action.send:hover{background-color:var(--vscode-button-hoverBackground)}
    .btn-action.stop{background-color:var(--vscode-errorForeground);color:white}
    .btn-action.stop:hover{opacity:0.9}
    .btn-secondary{padding:8px 16px;border:1px solid var(--vscode-button-secondaryBackground);border-radius:4px;background-color:var(--vscode-button-secondaryBackground);color:var(--vscode-button-secondaryForeground);cursor:pointer;font-family:var(--vscode-font-family);font-size:0.9em;display:inline-flex;align-items:center;gap:6px;transition:all 0.2s ease}
    .btn-secondary:hover{opacity:0.9}
    .history-sidebar{position:fixed;right:0;top:0;bottom:0;width:320px;background:var(--vscode-sideBar-background);border-left:1px solid var(--vscode-sideBar-border);transform:translateX(100%);transition:transform 0.2s ease;z-index:100;display:flex;flex-direction:column;box-shadow:-2px 0 8px rgba(0,0,0,0.3)}
    .history-sidebar.visible{transform:translateX(0)}
    .history-header{padding:12px;border-bottom:1px solid var(--vscode-sideBar-border);display:flex;justify-content:space-between;align-items:center;background:var(--vscode-sideBarSectionHeader-background)}
    .history-title{font-weight:600;font-size:0.9em;color:var(--vscode-sideBarSectionHeader-foreground);display:flex;align-items:center;gap:8px}
    .history-list{flex:1;overflow-y:auto;padding:8px}
    .history-item{padding:10px;margin-bottom:8px;background:var(--vscode-list-item-background);border-radius:4px;cursor:pointer;border:1px solid transparent;transition:all 0.2s ease}
    .history-item:hover{border-color:var(--vscode-focusBorder);background:var(--vscode-list-hoverBackground)}
    .history-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    .history-item-layer{font-size:0.7em;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:var(--vscode-badge-background);color:var(--vscode-badge-foreground);font-weight:600}
    .history-item-time{font-size:0.7em;color:var(--vscode-descriptionForeground)}
    .history-item-title{font-size:0.85em;font-weight:500;margin-bottom:6px;color:var(--vscode-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .history-item-meta{font-size:0.75em;color:var(--vscode-descriptionForeground);margin-bottom:6px;display:flex;gap:8px;align-items:center}
    .history-item-actions{display:flex;gap:6px}
    .history-item-actions .btn-secondary{flex:1;justify-content:center;font-size:0.75em;padding:4px 8px}
    .history-item-actions .delete-btn{flex:0 0 32px;min-width:32px;padding:4px;display:flex;align-items:center;justify-content:center;font-size:1.2em;line-height:1;}
    .history-item-actions .delete-btn:hover{background:var(--vscode-errorForeground);color:white;border-color:var(--vscode-errorForeground);}
    .history-empty{text-align:center;padding:30px 20px;color:var(--vscode-descriptionForeground);font-style:italic;font-size:0.85em}
    .history-refresh-btn{background:transparent;border:none;color:var(--vscode-foreground);cursor:pointer;font-size:1.1em;padding:4px;border-radius:4px;display:flex;align-items:center;justify-content:center;}
    .history-refresh-btn:hover{background:var(--vscode-toolbar-hoverBackground)}
    .btn-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;border-radius:4px;cursor:pointer;color:var(--vscode-foreground);transition:all 0.2s ease;font-size:1.2em;}
    .btn-icon:hover{background:var(--vscode-toolbar-hoverBackground);border-color:var(--vscode-input-border)}

    /* Unified Tool Card - Simple format: |category icon| tool name | toggle | */
    .tool-category-badge{display:inline-flex;align-items:center;justify-content:center;padding:2px 4px;border-radius:3px;margin-right:6px;font-size:14px;line-height:1;vertical-align:middle}

    .tool-call-card{margin:4px 0;border-radius:4px;overflow:hidden}
    .tool-call-header{display:flex;align-items:center;gap:6px;padding:8px 12px;background-color:var(--vscode-panelSectionHeader-background);cursor:pointer;user-select:none;transition:background-color 0.2s}
    .tool-call-header:hover{background-color:var(--vscode-panelSectionHeader-hoverBackground)}
    .tool-call-name{font-weight:600;font-size:13px;color:var(--vscode-foreground)}
    .tool-call-toggle-icon{margin-left:auto;color:var(--vscode-descriptionForeground);font-size:14px}
    .tool-call-card.collapsed .tool-call-toggle-icon .codicon{transform:rotate(-90deg)}
    .tool-call-card.collapsed .tool-call-body{display:none}

    .tool-call-body{padding:10px 12px;background-color:var(--vscode-panel-background)}
    .tool-card-result pre{margin:0;padding:10px;background-color:var(--vscode-textCodeBlock-background);border-radius:4px;font-family:var(--vscode-editor-font-family);font-size:12px;overflow-x:auto;max-height:400px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}

    .tool-call-card.running .tool-call-header{border-left:3px solid var(--vscode-progressBar-background)}
    .tool-call-card.done .tool-call-header{border-left:3px solid var(--vscode-terminal-successBackground)}
    .tool-call-card.error .tool-call-header{border-left:3px solid var(--vscode-errorForeground)}
    .tool-call-status{font-size:14px}

    /* Auto-scroll toggle in header */
    .auto-scroll-toggle{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:4px;font-size:0.8em;cursor:pointer;transition:all 0.2s;border:1px solid transparent}
    .auto-scroll-toggle.enabled{background:var(--vscode-terminal-successBackground);color:white;border-color:var(--vscode-terminal-successBackground)}
    .auto-scroll-toggle.disabled{background:var(--vscode-descriptionForeground);color:var(--vscode-editor-background);border-color:var(--vscode-descriptionForeground)}
    .auto-scroll-toggle:hover{opacity:0.9}
    .auto-scroll-toggle .codicon{font-size:14px}

    /* Proxy Health Dashboard */
    .proxy-status{display:none;align-items:center;gap:6px;padding:2px 8px;border-radius:4px;font-size:0.75em;font-weight:500;cursor:pointer;transition:all 0.2s}
    .proxy-status.visible{display:flex}
    .proxy-status.online{background:rgba(46,160,67,0.15);color:#2ea043;border:1px solid rgba(46,160,67,0.3)}
    .proxy-status.degraded{background:rgba(210,153,34,0.15);color:#d29922;border:1px solid rgba(210,153,34,0.3)}
    .proxy-status.offline{background:rgba(248,81,73,0.15);color:#f85149;border:1px solid rgba(248,81,73,0.3)}
    .proxy-dashboard-panel{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--vscode-editorWidget-background);border-top:1px solid var(--vscode-editorWidget-border);padding:12px 16px;z-index:50;max-height:200px;overflow-y:auto}
    .proxy-dashboard-panel.visible{display:block}
    .proxy-dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;max-width:900px;margin:0 auto}
    .proxy-metric-card{background:var(--vscode-panel-background);border:1px solid var(--vscode-panel-border);border-radius:4px;padding:8px 10px}
    .proxy-metric-label{font-size:0.7em;color:var(--vscode-descriptionForeground);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
    .proxy-metric-value{font-size:0.9em;font-weight:600;color:var(--vscode-foreground)}
    .proxy-metric-bar{height:3px;background:var(--vscode-input-border);border-radius:2px;margin-top:4px;overflow:hidden}
    .proxy-metric-fill{height:100%;border-radius:2px;transition:width 0.3s ease}
    .proxy-metric-fill.ok{background:#2ea043}
    .proxy-metric-fill.warn{background:#d29922}
    .proxy-metric-fill.crit{background:#f85149}
    .proxy-close-btn{position:absolute;top:8px;right:8px;background:transparent;border:none;color:var(--vscode-foreground);cursor:pointer;font-size:1.1em}
    .proxy-close-btn:hover{color:var(--vscode-errorForeground)}
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="header-item"><span class="codicon codicon-folder-active"></span><span id="workspaceName">{workspaceName}</span></div>
      <div class="header-item"><span class="codicon codicon-file"></span><span id="currentFile">None</span></div>
      <div class="header-item"><span class="codicon codicon-git-branch"></span><span id="contextTitle">Context: {workspaceName}</span></div>
      <div class="header-item" id="conversationTitleItem" style="display:none;"><span class="codicon codicon-comment"></span><span id="conversationTitle"></span></div>
    </div>
    <div class="header-right">
      <div id="conversationIndicator" style="display:none;font-size:0.8em;color:var(--vscode-descriptionForeground);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
        <span class="codicon codicon-comment-discussion"></span><span id="conversationId"></span>
      </div>
      <!-- Proxy Health Indicator -->
      <div class="proxy-status" id="proxyStatus" onclick="toggleProxyDashboard()" title="Proxy health status">
        <span class="codicon codicon-server-environment"></span>
        <span id="proxyStatusText">Proxy</span>
      </div>
      <!-- Auto-scroll toggle -->
      <div class="header-item auto-scroll-toggle enabled" id="autoScrollToggle" onclick="toggleAutoScroll()" title="Auto-scroll on new messages (click to toggle)">
        <span class="codicon codicon-arrow-down" style="font-size:14px;margin-right:4px"></span>
        <span style="font-size:0.85em">Auto-scroll</span>
      </div>
      <button class="btn-icon" onclick="newChat()" title="New Chat">&#10133;</button>
      <button class="btn-icon" onclick="openSettings()" title="Settings (S)">&#9881;</button>
      <button class="btn-icon" onclick="toggleHistorySidebar()" title="History (H)">&#128196;</button>
    </div>
  </div>
  
  <div class="center-panel">
    <div class="timeline" id="timeline">
      <div class="message agent">
        <span class="codicon codicon-robot" style="margin-right:8px;"></span>
        Hello! I am your i2-Vision coding agent. What would you like to work on?
      </div>
    </div>
  </div>

  <div class="footer-panel">
    <div class="input-container">
      <div class="provider-model-row">
        <div class="selector-group">
          <label for="providerSelect">Provider:</label>
          <select id="providerSelect" onchange="onProviderChange()">
            <option value="ollama" {selectedProvider}>Ollama</option>
            <option value="deepseek" {selectedProviderDeepSeek}>DeepSeek</option>
            <option value="3d-llm" {selectedProvider3DLlm}>3D LLM</option>
          </select>
        </div>
        <div class="selector-group">
          <label for="modelSelect">Model:</label>
          <select id="modelSelect" onchange="onModelChange()" style="min-width:180px;">
            <option value="{currentModel}" selected>{currentModel}</option>
          </select>
        </div>
        <div class="token-meter">
          <span class="codicon codicon-database"></span>
          <div class="token-bar"><div class="token-fill" id="tokenFill" style="width:0%"></div></div>
          <span id="tokenText">0 / 0</span>
        </div>
      </div>
      <textarea class="input-box" id="userInput" placeholder="Ask me anything about your code..." rows="3"></textarea>
      <div class="button-row">
        <button class="btn-action send" id="actionBtn">
          <span class="codicon codicon-play" id="actionIcon"></span>
          <span id="actionText">Send</span>
        </button>
        <button class="btn-secondary" id="clearBtn">
          <span class="codicon codicon-clear-all"></span>Clear
        </button>
      </div>
    </div>
  </div>
  
  <div class="history-sidebar" id="historySidebar">
    <div class="history-header">
      <span class="history-title">
        <span class="codicon codicon-comment-discussion"></span>Conversation History
      </span>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="history-refresh-btn" onclick="refreshHistory()" title="Refresh">&#8635;</button>
        <button class="btn-icon" onclick="toggleHistorySidebar()" title="Close">&#10005;</button>
      </div>
    </div>
    <div class="history-list" id="historyList">
      <div class="history-empty">Loading...</div>
    </div>
  </div>

  <!-- Proxy Health Dashboard Panel -->
  <div class="proxy-dashboard-panel" id="proxyDashboardPanel">
    <button class="proxy-close-btn" onclick="toggleProxyDashboard()" title="Close">&#10005;</button>
    <div class="proxy-dashboard-grid" id="proxyDashboardGrid">
      <div class="proxy-metric-card">
        <div class="proxy-metric-label">Status</div>
        <div class="proxy-metric-value" id="proxyMetricStatus">--</div>
      </div>
      <div class="proxy-metric-card">
        <div class="proxy-metric-label">Messages</div>
        <div class="proxy-metric-value" id="proxyMetricMessages">--</div>
        <div class="proxy-metric-bar"><div class="proxy-metric-fill ok" id="proxyMetricMessagesBar" style="width:0%"></div></div>
      </div>
      <div class="proxy-metric-card">
        <div class="proxy-metric-label">TTL Remaining</div>
        <div class="proxy-metric-value" id="proxyMetricTtl">--</div>
        <div class="proxy-metric-bar"><div class="proxy-metric-fill ok" id="proxyMetricTtlBar" style="width:0%"></div></div>
      </div>
      <div class="proxy-metric-card">
        <div class="proxy-metric-label">Tokens</div>
        <div class="proxy-metric-value" id="proxyMetricTokens">--</div>
        <div class="proxy-metric-bar"><div class="proxy-metric-fill ok" id="proxyMetricTokensBar" style="width:0%"></div></div>
      </div>
      <div class="proxy-metric-card">
        <div class="proxy-metric-label">Avg Latency</div>
        <div class="proxy-metric-value" id="proxyMetricLatency">--</div>
      </div>
      <div class="proxy-metric-card">
        <div class="proxy-metric-label">Warnings</div>
        <div class="proxy-metric-value" id="proxyMetricWarnings">--</div>
      </div>
    </div>
  </div>

  <script>
    const vscode = acquireVsCodeApi();
    const timeline = document.getElementById('timeline');
    const userInput = document.getElementById('userInput');
    const actionBtn = document.getElementById('actionBtn');
    const actionIcon = document.getElementById('actionIcon');
    const actionText = document.getElementById('actionText');
    const clearBtn = document.getElementById('clearBtn');
    const tokenFill = document.getElementById('tokenFill');
    const tokenText = document.getElementById('tokenText');
    const providerSelect = document.getElementById('providerSelect');
    const modelSelect = document.getElementById('modelSelect');
    const autoScrollToggle = document.getElementById('autoScrollToggle');

    let streamingElement = null;
    let thinkingEl = null;
    let isProcessing = false;
    const streamingEnabled = {streamingEnabled};
    const showThinkingSetting = {showThinking};
    let historySidebarVisible = false;
    let autoScrollEnabled = true;
    let proxyDashboardVisible = false;
    let proxyDashboardInitialized = false;
    
    window.addEventListener('load', function() {
      vscode.postMessage({ command: 'fetch_models' });
      // Fetch history on load
      setTimeout(() => {
        vscode.postMessage({ command: 'fetch_history' });
      }, 500);

      // Initialize auto-scroll toggle state
      updateAutoScrollUI();
    });
    
    function toggleHistorySidebar() {
      historySidebarVisible = !historySidebarVisible;
      const sidebar = document.getElementById('historySidebar');
      if (historySidebarVisible) {
        sidebar.classList.add('visible');
        refreshHistory();
      } else {
        sidebar.classList.remove('visible');
      }
    }
    
    function refreshHistory() {
      vscode.postMessage({ command: 'fetch_history' });
    }
    
    function confirmDelete(convId) {
      // Use VSCode's message API instead of browser confirm
      vscode.postMessage({ command: 'confirm_delete', conversationId: convId });
    }

    function renderHistoryList(conversations) {
      const list = document.getElementById('historyList');
      if (!conversations || conversations.length === 0) {
        list.innerHTML = '<div class="history-empty">No saved conversations yet.</div>';
        return;
      }
      list.innerHTML = conversations.map(function(conv) {
        const date = new Date(conv.updatedAt);
        const timeStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        return '<div class="history-item" data-id="' + conv.id + '">' +
          '<div class="history-item-header">' +
            '<span class="history-item-layer">' + escapeHtml(conv.layer) + '</span>' +
            '<span class="history-item-time">' + timeStr + '</span>' +
          '</div>' +
          '<div class="history-item-title">' + escapeHtml(conv.contextTitle || 'Untitled') + '</div>' +
          '<div class="history-item-meta">' +
            '<span><span class="codicon codicon-comment"></span> ' + conv.messageCount + ' msgs</span>' +
            '<span><span class="codicon codicon-folder"></span> ' + escapeHtml(conv.workspace) + '</span>' +
          '</div>' +
          '<div class="history-item-actions">' +
            '<button class="btn-secondary resume-btn" data-conv-id="' + conv.id + '" style="flex:1;"><span class="codicon codicon-reply"></span> Resume</button>' +
            '<button class="btn-secondary delete-btn" data-conv-id="' + conv.id + '" title="Delete">&#128465;</button>' +
          '</div>' +
        '</div>';
      }).join('');
      
      // Re-attach event listeners using delegation on the list container
      list.onclick = function(e) {
        const target = e.target;
        // Check if click is on or inside delete-btn
        let deleteBtn = null;
        let resumeBtn = null;
        if (target.classList && target.classList.contains('delete-btn')) {
          deleteBtn = target;
        } else if (target.parentElement && target.parentElement.classList.contains('delete-btn')) {
          deleteBtn = target.parentElement;
        }
        if (target.classList && target.classList.contains('resume-btn')) {
          resumeBtn = target;
        } else if (target.parentElement && target.parentElement.classList.contains('resume-btn')) {
          resumeBtn = target.parentElement;
        }
        if (deleteBtn) {
          e.stopPropagation();
          const convId = deleteBtn.getAttribute('data-conv-id');
          console.log('Delete clicked:', convId);
          confirmDelete(convId);
        } else if (resumeBtn) {
          e.stopPropagation();
          const convId = resumeBtn.getAttribute('data-conv-id');
          console.log('Resume clicked:', convId);
          vscode.postMessage({ command: 'resume_conversation', conversationId: convId });
        }
      };
    }
    
    actionBtn.addEventListener('click', function() {
      if (isProcessing) {
        vscode.postMessage({ command: 'stop_agent' });
      } else {
        const content = userInput.value.trim();
        if (content) {
          vscode.postMessage({ command: 'user_input', content: content });
          userInput.value = '';
        }
      }
    });
    
    userInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        actionBtn.click();
      }
    });
    
    clearBtn.addEventListener('click', function() {
      timeline.innerHTML = '';
      streamingElement = null;
      thinkingEl = null;
      setProcessingState(false);
    });
    
    function onProviderChange() {
      const provider = providerSelect.value;
      vscode.postMessage({ command: 'change_provider', provider: provider });
    }
    
    function onModelChange() {
      const model = modelSelect.value;
      vscode.postMessage({ command: 'change_model', model: model });
    }
    
    function openSettings() {
      vscode.postMessage({ command: 'open_settings' });
    }

    function newChat() {
      vscode.postMessage({ command: 'new_chat' });
    }
    
    window.addEventListener('message', function(event) {
      const message = event.data;
      switch(message.command) {
        case 'clear_conversation': timeline.innerHTML = ''; streamingElement = null; thinkingEl = null; setProcessingState(false); document.getElementById('conversationIndicator').style.display = 'none'; break;
        case 'user_message': appendUserMessage(message.content); break;
        case 'restored_message': appendRestoredMessage(message.content, message.toolCalls, message.timestamp); break;
        case 'thinking': showThinkingIndicator(message.message); break;
        case 'thinking_update': updateThinkingIndicator(message.message); break;
        case 'reasoning': appendReasoningCard(message.reasoning); break;
        case 'tool_start': appendToolCard(message.toolName, message.args); collapseAllToolCardsExceptLast(); break;
        case 'tool_complete': updateToolCard(message.toolName, message.result); collapseAllToolCardsExceptLast(); break;
        case 'streaming_text': appendStreamingText(message.text); break;
        case 'assistant_response':
          if (!streamingElement && message.content) appendStreamingText(message.content);
          finalizeStreamingText(message.durationMs);
          setProcessingState(false);
          break;
        case 'token_usage': updateTokenMeter(message.tokenUsage, message.contextLength); break;
        case 'error': appendErrorMessage(message.error); setProcessingState(false); break;
        case 'stopped': hideThinkingIndicator(); setProcessingState(false); appendStoppedMessage(); break;
        case 'provider_changed': providerSelect.value = message.provider; vscode.postMessage({ command: 'fetch_models' }); break;
        case 'model_changed': modelSelect.value = message.model; break;
        case 'models_list': populateModelDropdown(message.models, message.currentModel, message.currentProvider); break;
        case 'context_title':
          const titleEl = document.getElementById('conversationTitle');
          const titleItem = document.getElementById('conversationTitleItem');
          if (titleEl && titleItem) {
            titleEl.textContent = message.contextTitle;
            titleItem.style.display = 'flex';
          }
          break;
        case 'history_list': renderHistoryList(message.conversations); break;
        case 'conversation_resumed':
          document.getElementById('conversationIndicator').style.display = 'block';
          document.getElementById('conversationId').textContent = message.conversationId.substring(0, 8) + '...';
          // Update conversation title in header
          const resumedTitleEl = document.getElementById('conversationTitle');
          const resumedTitleItem = document.getElementById('conversationTitleItem');
          if (resumedTitleEl && resumedTitleItem && message.contextTitle) {
            resumedTitleEl.textContent = message.contextTitle;
            resumedTitleItem.style.display = 'flex';
          }
          showToast('Conversation resumed');
          toggleHistorySidebar();
          break;
        case 'conversation_deleted': showToast('Conversation deleted'); break;
        case 'proxy_dashboard':
          if (!proxyDashboardInitialized && message.status) {
            document.getElementById('proxyStatus').classList.add('visible');
            proxyDashboardInitialized = true;
          }
          updateProxyDashboard(message);
          break;
      }
      scrollToBottom();
    });
    
    function populateModelDropdown(models, currentModel, currentProvider) {
      modelSelect.innerHTML = '';
      if (models && models.length > 0) {
        models.forEach(function(model) {
          const option = document.createElement('option');
          option.value = model;
          option.textContent = model;
          if (model === currentModel) option.selected = true;
          modelSelect.appendChild(option);
        });
      } else {
        const option = document.createElement('option');
        option.value = currentModel;
        option.textContent = currentModel;
        option.selected = true;
        modelSelect.appendChild(option);
      }
    }
    
    function appendUserMessage(content) {
      const div = document.createElement('div');
      div.className = 'message user';
      div.textContent = content;
      timeline.appendChild(div);
    }

    function appendReasoningCard(reasoning) {
      const card = document.createElement('div');
      card.className = 'reasoning-card';
      card.innerHTML = '<div class="reasoning-card-header"><span class="codicon codicon-lightbulb"></span>Reasoning</div>' +
        '<div class="reasoning-card-content">' + escapeHtml(reasoning) + '</div>';
      timeline.appendChild(card);
      scrollToBottom();
    }
    
    /**
     * Unified tool card HTML - used for BOTH new chat and resumed chat
     * Simple format: |category icon| tool name | collapse/expand |
     */
    function createToolCardHTML(toolName, args, result, durationMs, isError, toolCallId) {
      const categoryInfo = getToolCategory(toolName);
      const categoryBadge = categoryInfo ?
        '<span class="tool-category-badge" style="color: ' + categoryInfo.color + ';" title="' + categoryInfo.displayName + '">' +
          categoryInfo.icon +
        '</span>' : '';

      const statusIcon = isError ? '✗' : '✓';
      const statusColor = isError ? 'var(--vscode-errorForeground)' : 'var(--vscode-terminal-successBackground)';
      const resultContent = result ? '<div class="tool-card-result"><pre>' + escapeHtml(result.substring(0, 3000)) + '</pre></div>' : '';

      return '<div class="tool-call-card' + (isError ? ' error' : ' done collapsed') + '"' + (toolCallId ? ' data-tool-call-id="' + toolCallId + '"' : '') + '>' +
        '<div class="tool-call-header" onclick="toggleToolCallCard(this)">' +
          '<span class="tool-call-status" style="color: ' + statusColor + '">' + statusIcon + '</span>' +
          categoryBadge +
          '<span class="tool-call-name">' + escapeHtml(toolName.replace(/_/g, ' ')) + '</span>' +
          '<span class="tool-call-toggle-icon"><span class="codicon codicon-chevron-down"></span></span>' +
        '</div>' +
        '<div class="tool-call-body">' + resultContent + '</div>' +
      '</div>';
    }

    function appendRestoredMessage(content, toolCalls, timestamp) {
      const div = document.createElement('div');
      div.className = 'message restored';
      div.textContent = content;
      timeline.appendChild(div);
      if (toolCalls && toolCalls.length > 0) {
        toolCalls.forEach(function(tc) {
          const cardHTML = createToolCardHTML(tc.toolName, tc.args, tc.result, tc.durationMs, !!tc.error, tc.toolCallId);
          const card = document.createElement('div');
          card.innerHTML = cardHTML;
          timeline.appendChild(card.firstElementChild);
        });
      }
    }
    
    function showThinkingIndicator(message) {
      if (!showThinkingSetting) return;
      if (thinkingEl) thinkingEl.remove();
      thinkingEl = document.createElement('div');
      thinkingEl.className = 'thinking-indicator';
      thinkingEl.innerHTML = '<span class="codicon codicon-loading"></span><span>' + message + '</span>';
      timeline.appendChild(thinkingEl);
      setProcessingState(true);
    }
    
    function updateThinkingIndicator(message) {
      if (thinkingEl) thinkingEl.remove();
      thinkingEl = document.createElement('div');
      thinkingEl.className = 'thinking-indicator';
      thinkingEl.innerHTML = '<span class="codicon codicon-loading"></span><span>' + message + '</span>';
      timeline.appendChild(thinkingEl);
    }
    
    function hideThinkingIndicator() {
      if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
    }
    
    function appendToolCard(toolName, args) {
      if (streamingElement) {
        streamingElement = null;
      }
      const card = document.createElement('div');
      card.innerHTML = createToolCardHTML(toolName, args, null, 0, false, null);
      const cardEl = card.firstElementChild;
      cardEl.classList.remove('done', 'collapsed');
      cardEl.classList.add('running');
      cardEl.dataset.toolName = toolName;
      const statusSpan = cardEl.querySelector('.tool-call-status');
      if (statusSpan) {
        statusSpan.textContent = '⏳';
        statusSpan.style.color = 'var(--vscode-progressBar-background)';
      }
      const toggleIcon = cardEl.querySelector('.tool-call-toggle-icon');
      if (toggleIcon) toggleIcon.remove();
      timeline.appendChild(cardEl);
    }

    function openFileInEditor(filePath) {
      vscode.postMessage({ command: 'open_file', filePath: filePath, viewColumn: 'active' });
    }

    function openFileInNewWindow(filePath) {
      vscode.postMessage({ command: 'open_file', filePath: filePath, viewColumn: 'beside' });
    }

    function updateToolCard(toolName, result) {
      const cards = timeline.querySelectorAll('.tool-call-card.running');
      let targetCard = null;
      for (let i = cards.length - 1; i >= 0; i--) {
        if (cards[i].dataset.toolName === toolName) {
          targetCard = cards[i];
          break;
        }
      }
      if (targetCard) {
        const isError = !result || result.toLowerCase().includes('error') || result.toLowerCase().includes('failed');
        targetCard.classList.remove('running');
        targetCard.classList.add('done', 'collapsed');
        const statusSpan = targetCard.querySelector('.tool-call-status');
        if (statusSpan) {
          statusSpan.textContent = isError ? '✗' : '✓';
          statusSpan.style.color = isError ? 'var(--vscode-errorForeground)' : 'var(--vscode-terminal-successBackground)';
        }
        const header = targetCard.querySelector('.tool-call-header');
        if (header && !header.querySelector('.tool-call-toggle-icon')) {
          const toggleIcon = document.createElement('span');
          toggleIcon.className = 'tool-call-toggle-icon';
          toggleIcon.innerHTML = '<span class="codicon codicon-chevron-down"></span>';
          header.appendChild(toggleIcon);
        }
        const body = targetCard.querySelector('.tool-call-body');
        if (body && result) {
          body.innerHTML = '<div class="tool-card-result"><pre>' + escapeHtml(result.substring(0, 3000)) + '</pre></div>';
        }
      }
    }
    
    function appendStreamingText(text) {
      if (!streamingElement) {
        streamingElement = document.createElement('div');
        streamingElement.className = 'response-card streaming';
        streamingElement.innerHTML = '<div class="response-card-body"></div>';
        timeline.appendChild(streamingElement);
        scrollToBottom();
      }
      const body = streamingElement.querySelector('.response-card-body');
      if (body) {
        // Accumulate raw text; render markdown on finalize
        body.dataset.rawText = (body.dataset.rawText || '') + text;
        body.textContent += text;
        scrollToBottom();
      }
    }
    
    function finalizeStreamingText(durationMs) {
      hideThinkingIndicator();
      let targetElement = streamingElement;
      if (!targetElement) {
        const responseCards = timeline.querySelectorAll('.response-card');
        if (responseCards.length > 0) targetElement = responseCards[responseCards.length - 1];
      }
      if (targetElement) {
        targetElement.className = 'response-card done';
        const body = targetElement.querySelector('.response-card-body');
        if (body && body.dataset.rawText) {
          body.innerHTML = renderMarkdown(body.dataset.rawText);
        }
      }
      streamingElement = null;
    }
    
    function updateTokenMeter(tokenUsage, contextLength) {
      const total = tokenUsage.prompt + tokenUsage.completion;
      const percentage = Math.min((total / contextLength) * 100, 100);
      tokenFill.style.width = percentage + '%';
      tokenText.textContent = total.toLocaleString() + ' / ' + contextLength.toLocaleString();
      if (percentage > 80) tokenFill.style.background = 'var(--vscode-errorForeground)';
      else if (percentage > 60) tokenFill.style.background = 'var(--vscode-terminal-ansiYellow)';
      else tokenFill.style.background = 'var(--vscode-terminal-successBackground)';
    }
    
    function appendErrorMessage(error) {
      const div = document.createElement('div');
      div.className = 'message error';
      div.innerHTML = '<span class="codicon codicon-error" style="margin-right:8px;"></span>Error: ' + error;
      timeline.appendChild(div);
    }
    
    function appendStoppedMessage() {
      const div = document.createElement('div');
      div.className = 'message stopped';
      div.innerHTML = '<span class="codicon codicon-debug-stop" style="margin-right:8px;"></span>Processing stopped by user.';
      timeline.appendChild(div);
    }
    
    function toggleToolCallCard(header) {
      const card = header.parentElement;
      card.classList.toggle('collapsed');
    }
    
    function collapseAllToolCardsExceptLast() {
      const cards = timeline.querySelectorAll('.tool-call-card.done');
      cards.forEach(function(card, index) {
        if (index < cards.length - 1) card.classList.add('collapsed');
        else card.classList.remove('collapsed');
      });
    }
    
    function scrollToBottom() {
      timeline.scrollTo({ top: timeline.scrollHeight, behavior: 'smooth' });
    }

    function updateAutoScrollUI() {
      if (autoScrollToggle) {
        autoScrollToggle.classList.toggle('enabled', autoScrollEnabled);
        autoScrollToggle.classList.toggle('disabled', !autoScrollEnabled);
      }
    }

    function toggleAutoScroll() {
      autoScrollEnabled = !autoScrollEnabled;
      updateAutoScrollUI();
    }
    
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    /**
     * Render markdown-like text to HTML for agent cards.
     * Handles: headers, bold, italic, inline code, code blocks,
     * blockquotes, lists, tables, links, horizontal rules.
     */
    function renderMarkdown(text) {
      if (!text) return '';
      var html = escapeHtml(text);

      // Horizontal rules
      html = html.replace(/^(---|\*\*|___)\s*$/gm, '<hr>');

      // Code blocks: ```lang\ncode\n```
      html = html.replace(/```(\w+)?\n?([\s\S]*?)```/g, function(match, lang, code) {
        return '<pre><code class="language-' + (lang || 'plaintext') + '">' + code + '</code></pre>';
      });

      // Inline code: `code`
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Headers: ### Header
      html = html.replace(/^######\s(.+)$/gm, '<h6>$1</h6>');
      html = html.replace(/^#####\s(.+)$/gm, '<h5>$1</h5>');
      html = html.replace(/^####\s(.+)$/gm, '<h4>$1</h4>');
      html = html.replace(/^###\s(.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^##\s(.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^#\s(.+)$/gm, '<h1>$1</h1>');

      // Blockquotes: > quote
      html = html.replace(/^(>\s?.+)$/gm, function(match, content) {
        return '<blockquote>' + content.replace(/^>\s?/, '') + '</blockquote>';
      });

      // Tables (simple pipe-separated)
      var tableBlocks = html.split('\n\n');
      html = tableBlocks.map(function(block) {
        var lines = block.split('\n').filter(function(l) { return l.trim(); });
        if (lines.length >= 2 && lines[0].includes('|') && lines[1].includes('---')) {
          var headerCells = lines[0].split('|').map(function(c) { return c.trim(); }).filter(function(c) { return c; });
          var headerRow = '<tr>' + headerCells.map(function(c) { return '<th>' + c + '</th>'; }).join('') + '</tr>';
          var bodyRows = lines.slice(2).map(function(row) {
            var cells = row.split('|').map(function(c) { return c.trim(); }).filter(function(c) { return c; });
            return '<tr>' + cells.map(function(c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
          }).join('');
          return '<table><thead>' + headerRow + '</thead><tbody>' + bodyRows + '</tbody></table>';
        }
        return block;
      }).join('\n\n');

      // Bold: **text**
      html = html.replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>');

      // Italic: *text* (not inside bold)
      html = html.replace(/\*([^\*<]+)\*/g, '<em>$1</em>');

      // Links: [text](url)
      html = html.replace(/\[([^\]]+)\]\(([^\)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

      // Unordered lists
      html = html.replace(/((?:^\s*-\s.+$\n?)+)/gm, function(match, listBlock) {
        var items = listBlock.split('\n').filter(function(l) { return l.trim(); }).map(function(item) {
          return '<li>' + item.replace(/^\s*-\s*/, '') + '</li>';
        }).join('');
        return '<ul>' + items + '</ul>';
      });

      // Ordered lists
      html = html.replace(/((?:^\s*\d+\.\s.+$\n?)+)/gm, function(match, listBlock) {
        var items = listBlock.split('\n').filter(function(l) { return l.trim(); }).map(function(item) {
          return '<li>' + item.replace(/^\s*\d+\.\s*/, '') + '</li>';
        }).join('');
        return '<ol>' + items + '</ol>';
      });

      // Paragraphs: split on newlines, wrap non-block elements
      var lines = html.split('\n');
      var result = [];
      var inBlock = false;
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (line.match(/^<(h[1-6]|pre|blockquote|ul|ol|table|hr|li|tr|th|td|thead|tbody)/)) {
          result.push(line);
          inBlock = true;
        } else if (line.match(/^<\/(h[1-6]|pre|blockquote|ul|ol|table|li|tr|th|td|thead|tbody)/)) {
          result.push(line);
          inBlock = false;
        } else if (line.trim() === '') {
          result.push('');
          inBlock = false;
        } else if (!inBlock) {
          result.push('<p>' + line + '</p>');
        } else {
          result.push(line);
        }
      }

      return '<div class="md-content">' + result.join('\n') + '</div>';
    }

    function copyResponse() {
      const lastAgentMessage = timeline.querySelector('.message.agent:last-child');
      if (lastAgentMessage) {
        const content = lastAgentMessage.childNodes[0]?.textContent || '';
        vscode.postMessage({ command: 'copy_response', content: content });
      }
    }
    
    function applyChanges() {
      vscode.postMessage({ command: 'apply_changes' });
    }
    
    function setProcessingState(processing) {
      isProcessing = processing;
      if (processing) {
        actionBtn.classList.remove('send');
        actionBtn.classList.add('stop');
        actionIcon.className = 'codicon codicon-debug-stop';
        actionText.textContent = 'Stop';
        userInput.disabled = true;
        userInput.style.opacity = '0.5';
      } else {
        actionBtn.classList.remove('stop');
        actionBtn.classList.add('send');
        actionIcon.className = 'codicon codicon-play';
        actionText.textContent = 'Send';
        userInput.disabled = false;
        userInput.style.opacity = '1';
      }
    }
    
    function showToast(message) {
      const toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--vscode-notifications-background);color:var(--vscode-notifications-foreground);padding:10px 20px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.3);z-index:1000;font-size:0.9em;display:flex;align-items:center;gap:8px;';
      toast.innerHTML = '<span class="codicon codicon-check"></span>' + message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2000);
    }

    function toggleProxyDashboard() {
      proxyDashboardVisible = !proxyDashboardVisible;
      const panel = document.getElementById('proxyDashboardPanel');
      if (proxyDashboardVisible) {
        panel.classList.add('visible');
      } else {
        panel.classList.remove('visible');
      }
    }

    function updateProxyDashboard(data) {
      const statusEl = document.getElementById('proxyStatus');
      const statusText = document.getElementById('proxyStatusText');

      // Determine overall status from health/context
      let overallStatus = 'offline';
      if (data.error) {
        overallStatus = 'offline';
      } else if (data.health) {
        overallStatus = data.health.healthy ? 'online' : 'degraded';
      }
      statusEl.classList.remove('online', 'degraded', 'offline');
      statusEl.classList.add(overallStatus);
      statusText.textContent = overallStatus.charAt(0).toUpperCase() + overallStatus.slice(1);

      // Update metrics
      if (data.health) {
        document.getElementById('proxyMetricStatus').textContent = data.health.status || 'Unknown';
      } else if (data.error) {
        document.getElementById('proxyMetricStatus').textContent = 'Proxy Unreachable';
      }

      // Map contextStatus (nested object shape) to dashboard fields
      let u = data.usageSummary || data.contextStatus || {};
      // Tokens: nested as { used, total, percentage, remaining, prompt, completion, reasoning }
      const tokenUsed = u.tokens?.used || 0;
      const tokenTotal = u.tokens?.total || 1;
      const tokenPct = u.tokens?.percentage || (tokenTotal > 0 ? (tokenUsed / tokenTotal) * 100 : 0);
      // Messages: nested as { used, total, percentage, remaining }
      const msgUsed = u.messages?.used || 0;
      const msgTotal = u.messages?.total || 100;
      const msgPct = msgTotal !== Infinity ? Math.min((msgUsed / msgTotal) * 100, 100) : 0;
      // TTL: nested as { remainingMs, totalMs, percentage, expiresAt }
      const ttlRemainingMs = u.sessionTtl?.remainingMs || 0;
      const ttlPct = u.sessionTtl?.percentage || 0;
      const status = u.status || 'healthy';
      // Latency: nested as { lastMs, avgMs, minMs, maxMs }
      const avgLatencyMs = u.latency?.avgMs || 0;

      document.getElementById('proxyMetricMessages').textContent = msgUsed + ' / ' + msgTotal;
      const msgBar = document.getElementById('proxyMetricMessagesBar');
      msgBar.style.width = msgPct + '%';
      msgBar.className = 'proxy-metric-fill ' + (msgPct > 80 ? 'crit' : msgPct > 60 ? 'warn' : 'ok');

      const ttlText = ttlRemainingMs === Infinity || ttlRemainingMs === 0 ? 'Unknown' : Math.round(ttlRemainingMs / 60000) + ' min';
      document.getElementById('proxyMetricTtl').textContent = ttlText;
      const ttlBar = document.getElementById('proxyMetricTtlBar');
      ttlBar.style.width = ttlPct + '%';
      ttlBar.className = 'proxy-metric-fill ' + (ttlPct > 85 ? 'crit' : ttlPct > 60 ? 'warn' : 'ok');

      document.getElementById('proxyMetricTokens').textContent = tokenPct.toFixed(1) + '%';
      const tokBar = document.getElementById('proxyMetricTokensBar');
      tokBar.style.width = Math.min(tokenPct, 100) + '%';
      tokBar.className = 'proxy-metric-fill ' + (status === 'exhausted' || status === 'critical' ? 'crit' : status === 'warning' ? 'warn' : 'ok');

      document.getElementById('proxyMetricLatency').textContent = avgLatencyMs ? Math.round(avgLatencyMs) + ' ms' : '--';

      const warnings = (data.warnings || []).concat(u.warnings || []);
      document.getElementById('proxyMetricWarnings').textContent = warnings.length > 0 ? warnings.join('; ') : 'None';
    }

    /**
     * Tool category icon mappings
     */
    function getToolCategory(toolName) {
      const toolCategoryMap = {
        'list_directory': 'file',
        'read_file': 'file',
        'write_file': 'file',
        'search_files': 'file',
        'get_file_context': 'file',
        'revert_file': 'file',
        'revert_all': 'file',
        'list_snapshots': 'file',
        'git_status': 'git',
        'git_diff': 'git',
        'git_log': 'git',
        'git_branch': 'git',
        'git_commit': 'git',
        'run_build': 'build',
        'run_terminal': 'terminal',
        'kill_terminal': 'terminal',
        'list_terminals': 'terminal',
        'terminal_status': 'terminal',
        'kill_port': 'terminal',
        'apply_edits': 'edit'
      };

      const categoryIcons = {
        file: { icon: '📄', color: '#007acc', displayName: 'File Operations' },
        git: { icon: '🌿', color: '#6f42c1', displayName: 'Git Operations' },
        build: { icon: '⚙️', color: '#d46b08', displayName: 'Build & Compile' },
        terminal: { icon: '💻', color: '#2ea043', displayName: 'Terminal' },
        edit: { icon: '✏️', color: '#d29922', displayName: 'Edit Operations' }
      };

      const category = toolCategoryMap[toolName];
      return category ? categoryIcons[category] : undefined;
    }
